name: VelaBeat Baseline (Debug)

on:
  push:
    branches: [develop/velabeat-baseline, feature/velabeat-identity, feature/velabeat-universal-audit, feature/velabeat-car-display, feature/velabeat-mobile-car-only]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/velabeat-baseline.yml'
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Check Gradle tasks
        run: |
          chmod +x ./gradlew
          ./gradlew :app:tasks --all > gradle-tasks.txt
      - name: Build VelaBeat mobile and car debug APKs
        run: ./gradlew :app:assembleDevDebug --stacktrace
      - name: Report APK sizes
        if: success()
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -printf '%p %s bytes\n' | sort
      - name: Verify VelaBeat APK branding
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          APK="$(find app/build/outputs/apk -type f -name '*armeabi-v7a*debug*.apk' | head -n 1)"
          test -n "$APK"
          "$AAPT" dump badging "$APK" > velabeat-apk-branding.txt
          grep -q "application-label:'VelaBeat'" velabeat-apk-branding.txt
          grep -q "net.velalab.velabeat.dev" velabeat-apk-branding.txt
          if grep -q "leanback-launchable-activity:" velabeat-apk-branding.txt; then
            echo "Unexpected TV launcher" >&2
            exit 1
          fi
      - name: Upload APK branding inspection
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velabeat-apk-branding
          path: velabeat-apk-branding.txt
          if-no-files-found: warn
      - name: Upload mobile debug APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: velabeat-mobile-debug
          path: app/build/outputs/apk/**/*debug*.apk
          if-no-files-found: error
      - name: Upload Gradle task report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velabeat-gradle-tasks
          path: gradle-tasks.txt
          if-no-files-found: warn
