name: VelaBeat Baseline (Debug)

on:
  push:
    branches: [develop/velabeat-baseline]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/velabeat-baseline.yml'
      - 'app/**'
      - 'tv/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Check Gradle tasks
        run: |
          chmod +x ./gradlew
          ./gradlew :app:tasks :tv:tasks --all > gradle-tasks.txt
      - name: Build Android and TV debug APKs
        run: ./gradlew :app:assembleDevDebug :tv:assembleDevDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velabeat-baseline-debug
          path: |
            app/build/outputs/apk/**/*debug*.apk
            tv/build/outputs/apk/**/*debug*.apk
            gradle-tasks.txt
          if-no-files-found: warn
