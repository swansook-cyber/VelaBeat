name: VelaBeat Baseline (Debug)

on:
  push:
    branches: [develop/velabeat-baseline, feature/velabeat-identity]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/velabeat-baseline.yml'
      - 'app/**'
      - 'tv/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Check Gradle tasks
        run: |
          chmod +x ./gradlew
          ./gradlew :app:tasks :tv:tasks --all > gradle-tasks.txt
      - name: Build Android and TV debug APKs
        run: ./gradlew :app:assembleDevDebug :tv:assembleDevDebug --stacktrace
      - name: Report APK sizes
        if: success()
        run: |
          find app/build/outputs/apk tv/build/outputs/apk -type f -name '*.apk' -printf '%p %s bytes\n' | sort
      - name: Upload mobile debug APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: velabeat-mobile-debug
          path: app/build/outputs/apk/**/*debug*.apk
          if-no-files-found: error
      - name: Upload TV debug APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: velabeat-tv-debug
          path: tv/build/outputs/apk/**/*debug*.apk
          if-no-files-found: error
      - name: Upload Gradle task report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velabeat-gradle-tasks
          path: gradle-tasks.txt
          if-no-files-found: warn
