name: VelaBeat Baseline (Debug)

on:
  push:
    branches: [develop/velabeat-baseline, feature/velabeat-identity, feature/velabeat-universal-audit, feature/velabeat-car-display, feature/velabeat-universal-mobile-car-tv-20261027]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/velabeat-baseline.yml'
      - 'app/**'
      - 'tv/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

permissions:
  contents: read

jobs:
  universal-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit launcher entries and TV source overrides
        run: python3 scripts/universal_preflight.py | tee universal-preflight.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velabeat-universal-preflight
          path: |
            universal-preflight.txt
            universal-source-inventory.json
          if-no-files-found: warn

  universal-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK native build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "cmake;3.22.1" "ndk;27.0.12077973"
          "$SDKMANAGER" --list_installed | grep -E 'cmake;3.22.1|ndk;27.0.12077973'
      - name: Build single mobile car TV universal debug APK
        id: compile
        shell: bash
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :app:assembleDevDebug -Pvelabeat.universalTvSourceProbe=true --stacktrace 2>&1 | tee universal-source-probe.log
      - name: Verify single universal APK has mobile and TV launchers
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          : > universal-apk-launchers.txt
          AAPT="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          apk="app/build/outputs/apk/dev/debug/app-dev-universal-debug.apk"
          test -s "$apk"
          badging="$("$AAPT" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -E "^(package:|application-label:|launchable-activity:|leanback-launchable-activity:)" | tee universal-apk-launchers.txt
          "$AAPT" dump xmltree "$apk" AndroidManifest.xml > universal-manifest-tree.txt
          grep -Fq "package: name='net.velalab.velabeat.dev'" <<< "$badging"
          grep -Fxq "application-label:'VelaBeat'" <<< "$badging"
          grep -q '^launchable-activity:' <<< "$badging"
          grep -q '^leanback-launchable-activity:' <<< "$badging"
          echo "Single universal APK has both launchers; device installation and remote testing still required"
      - name: Upload launcher inspection
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velabeat-universal-launcher-inspection
          path: |
            universal-apk-launchers.txt
            universal-manifest-tree.txt
          if-no-files-found: warn
      - name: Upload single universal debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: velabeat-universal-mobile-car-tv-debug
          path: app/build/outputs/apk/dev/debug/app-dev-universal-debug.apk
          if-no-files-found: error
      - name: Upload experimental compiler log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velabeat-universal-source-probe
          path: universal-source-probe.log
          if-no-files-found: warn

